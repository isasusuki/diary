    // --- Web Audio Synthesizer (Zero dependencies, offline friendly) ---
    class CozyAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlayingMusic = false;
        this.musicInterval = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCutePop() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}
      }
      playSparkle() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const startTime = this.ctx.currentTime + idx * 0.06;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.08, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.35);
          });
        } catch (e) {}
      }
      toggleAmbientLofi(onStateChange) {
        if (this.isPlayingMusic) {
          this.stopAmbientLofi();
          if (onStateChange) onStateChange(false);
          return false;
        } else {
          this.startAmbientLofi();
          if (onStateChange) onStateChange(true);
          return true;
        }
      }
      startAmbientLofi() {
        this.init();
        if (!this.ctx) return;
        this.isPlayingMusic = true;
        const melodyNotes = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73];
        const playNote = () => {
          if (!this.isPlayingMusic || !this.ctx) return;
          const note = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note, now);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        };
        playNote();
        this.musicInterval = window.setInterval(playNote, 600);
      }
      stopAmbientLofi() {
        this.isPlayingMusic = false;
        if (this.musicInterval) {
          clearInterval(this.musicInterval);
          this.musicInterval = null;
        }
      }
    }

                              placeholder="Legenda da foto..."
                              className="w-full mt-2 text-center font-caveat text-sm text-gray-700 bg-transparent border-b border-dashed border-rose-200 focus:outline-none"
                            />
                          </div>
                        )}

                        {currentPage.widgets?.showSelfCare && (
                          <div className={`${currentPage.widgets?.showPolaroid ? 'md:col-span-7' : 'md:col-span-12'} bg-white/80 p-3 rounded-2xl border border-rose-200 shadow-2xs space-y-2`}>
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-xs text-rose-900">🕯️ Autocuidado do Dia</span>
                              <span className="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-bold">
                                {currentPage.widgets.selfCareTasks?.filter(t => t.done).length} / {currentPage.widgets.selfCareTasks?.length} feitos 💖
                              </span>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                              {currentPage.widgets.selfCareTasks?.map(t => (
                                <div
                                  key={t.id}
                                  onClick={() => {
                                    cozyAudio.playCutePop();
                                    setCurrentPage(prev => ({
                                      ...prev,
                                      widgets: {
                                        ...prev.widgets,
                                        selfCareTasks: prev.widgets.selfCareTasks.map(tk => tk.id === t.id ? { ...tk, done: !tk.done } : tk)
                                      }
                                    }));
                                  }}
                                  className={`flex items-center gap-2 p-1.5 rounded-xl border text-xs cursor-pointer ${
                                    t.done ? 'bg-rose-50 border-rose-200 text-rose-800 line-through opacity-85' : 'bg-white border-rose-100 text-gray-700'
                                  }`}
                                >
                                  <span>{t.done ? '✅' : '⚪'}</span>
                                  <span className="truncate">{t.icon} {t.label}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Affirmation */}
                      {currentPage.widgets?.showAffirmation && (
                        <div className="p-2.5 rounded-2xl bg-amber-50/80 border border-amber-200 flex items-center gap-2">
                          <span className="text-lg">💌</span>
                          <input
                            type="text"
                            value={currentPage.widgets.dailyAffirmation || ''}
                            onChange={e => setCurrentPage(prev => ({ ...prev, widgets: { ...prev.widgets, dailyAffirmation: e.target.value } }))}
                            placeholder="Afirmação do dia..."
                            className="w-full font-dancing text-base sm:text-lg text-amber-950 italic bg-transparent border-b border-dashed border-amber-300 focus:outline-none"
                          />
                        </div>
                      )}
                    </div>

                    {/* Title */}
                    <div className="mb-4">
                      <input
                        type="text"
                        value={currentPage.title}
                        onChange={e => setCurrentPage(prev => ({ ...prev, title: e.target.value }))}
                        placeholder="Título da página..."
                        className={`w-full ${currentFontClass} font-bold text-2xl sm:text-3xl leading-snug bg-transparent border-b border-dashed border-rose-200 focus:border-rose-400 focus:outline-none py-1`}
                        style={{ textAlign: currentPage.textAlign, color: currentPage.textColor }}
                      />
                    </div>

                    {/* Text Body */}
                    <div className="relative mb-6">
                      <textarea
                        value={currentPage.content}
                        onChange={e => setCurrentPage(prev => ({ ...prev, content: e.target.value }))}
                        placeholder="Querido diário... escreva seus pensamentos e segredos aqui..."
                        rows={12}
                        className={`w-full ${currentFontClass} leading-relaxed bg-transparent border-none focus:outline-none resize-none`}
                        style={{ fontSize: `${currentPage.fontSize}px`, textAlign: currentPage.textAlign, color: currentPage.textColor }}
                      />
                    </div>

                    {/* Draggable Stickers Overlay */}
                    {currentPage.stickers?.map(stk => (
                      <div
                        key={stk.id}
                        onClick={e => { e.stopPropagation(); setSelectedStickerId(stk.id); }}
                        style={{
                          left: `${stk.x}%`,
                          top: `${stk.y}%`,
                          transform: `rotate(${stk.rotation}deg) scale(${stk.scale})`,
                          zIndex: stk.zIndex
                        }}
                        className={`absolute select-none cursor-grab active:cursor-grabbing ${
                          selectedStickerId === stk.id ? 'ring-2 ring-rose-400 rounded-xl bg-white/40' : 'hover:scale-105'
                        }`}
                      >
                        {stk.isTextBadge ? (
                          <div className="px-3 py-1 rounded-full font-bold text-xs bg-white text-rose-800 border border-rose-200 shadow-xs whitespace-nowrap">
                            {stk.content}
                          </div>
                        ) : (
                          <div className="text-4xl sm:text-5xl filter drop-shadow-sm select-none">
                            {stk.content}
                          </div>
                        )}

                        {/* Controls if selected */}
                        {selectedStickerId === stk.id && (
                          <div 
                            onClick={e => e.stopPropagation()}
                            className="absolute -top-9 left-1/2 -translate-x-1/2 flex items-center gap-1 bg-white border border-rose-200 rounded-full px-2 py-0.5 shadow-lg z-50 text-xs"
                          >
                            <button
                              onClick={() => { cozyAudio.playCutePop(); updateSticker(stk.id, { rotation: (stk.rotation + 15) % 360 }); }}
                              className="p-1 hover:bg-rose-100 rounded-full text-rose-600"
                              title="Girar"
                            >🔄</button>
                            <button
                              onClick={() => { cozyAudio.playCutePop(); updateSticker(stk.id, { scale: Math.min(2.5, stk.scale + 0.15) }); }}
                              className="p-1 hover:bg-rose-100 rounded-full text-rose-600"
                              title="Aumentar"
                            >🔍+</button>
                            <button
                              onClick={() => { cozyAudio.playCutePop(); updateSticker(stk.id, { scale: Math.max(0.6, stk.scale - 0.15) }); }}
                              className="p-1 hover:bg-rose-100 rounded-full text-rose-600"
                              title="Diminuir"
                            >🔍-</button>
                            <button
                              onClick={() => deleteSticker(stk.id)}
                              className="p-1 hover:bg-red-100 rounded-full text-red-500"
                              title="Remover"
                            >🗑️</button>
                          </div>
                        )}
                      </div>
                    ))}

                    <div className="mt-6 pt-4 border-t border-rose-200/40 flex items-center justify-between text-xs text-rose-300 font-quicksand">
                      <span>✨ Diário Chérie</span>
                      <span className="font-dancing text-sm text-rose-400">amor próprio & doçura</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: MY PAGES */}
            {activeTab === 'pages' && (
              <div className="space-y-5">
                <div className="flex items-center justify-between bg-white p-5 rounded-3xl border border-rose-100 shadow-xs">
                  <div>
                    <h2 className="font-playfair font-bold text-xl text-gray-800">Meu Caderno de Memórias 📚</h2>
                    <p className="text-xs text-gray-500">Você tem {myPages.length} {myPages.length === 1 ? 'página salva' : 'páginas salvas'}</p>
                  </div>
                  <button
                    onClick={handleNewPage}
                    className="px-4 py-2 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm"
                  >
                    <span>➕</span>
                    <span>Nova Página</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {myPages.map(page => (
                    <div key={page.id} className="bg-white rounded-3xl border border-rose-200 p-5 flex flex-col justify-between shadow-xs hover:shadow-md transition-all">
                      <div>
                        <div className="flex items-center justify-between text-xs text-gray-400 mb-2">
                          <span>📅 {page.date}</span>
                          <span className="text-rose-500 font-bold">✨ {page.stickers?.length || 0} adesivos</span>
                        </div>
                        <h3 className="font-playfair font-bold text-lg text-gray-800 line-clamp-1">{page.title}</h3>
                        <p className="font-caveat text-xl text-gray-600 line-clamp-3 my-2">{page.content || 'Página sem texto...'}</p>
                      </div>

                      <div className="pt-3 border-t border-rose-100 flex items-center justify-between mt-3">
                        <div className="flex items-center gap-1.5">
                          <button
                            onClick={() => { cozyAudio.playCutePop(); setCurrentPage(page); setActiveTab('editor'); }}
                            className="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs"
                          >
                            ✏️ Editar
                          </button>
                          <button
                            onClick={() => {
                              setCurrentPage(page);
                              handleShareToClub();
                            }}
                            className="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 font-bold text-xs"
                          >
                            💌 Postar
                          </button>
                        </div>
                        <button
                          onClick={() => {
                            if (confirm('Deseja excluir esta página do seu diário?')) {
                              setMyPages(prev => prev.filter(p => p.id !== page.id));
                              if (currentPage.id === page.id) handleNewPage();
                            }
                          }}
                          className="p-1.5 hover:bg-red-50 text-gray-400 hover:text-red-500 rounded-xl"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: COMMUNITY FEED */}
            {activeTab === 'community' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-purple-100 via-pink-100 to-rose-100 p-6 rounded-3xl border border-rose-200 text-center relative overflow-hidden">
                  <span className="inline-block px-3 py-1 rounded-full bg-white/80 border border-purple-200 text-purple-700 font-bold text-xs mb-2">
                    🔒 Círculo Íntimo & Feed Privado
                  </span>
                  <h2 className="font-playfair font-bold text-2xl sm:text-3xl text-gray-800">Clube Secreto das Garotas 🌸</h2>
                  <p className="text-xs sm:text-sm text-gray-600 max-w-md mx-auto mt-1">
                    Um feed seguro onde compartilhamos nossas páginas decoradas, carinho e inspiração mútua.
                  </p>
                </div>

                <div className="space-y-6">
                  {communityFeed.map(post => (
                    <article key={post.id} className="bg-white rounded-3xl border border-rose-200 shadow-xs overflow-hidden">
                      {/* Author */}
                      <div className="p-4 sm:p-5 flex items-center justify-between border-b border-rose-100">
                        <div className="flex items-center gap-3">
                          <img src={post.author?.avatar} alt={post.author?.name} className="w-10 h-10 rounded-full object-cover ring-2 ring-rose-200" />
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className="font-bold text-sm text-gray-800">{post.author?.name}</span>
                              <span className="text-xs text-gray-400">{post.author?.handle}</span>
                            </div>
                            <span className="text-[11px] text-gray-400">{post.date} • Feed Privado 💌</span>
                          </div>
                        </div>

                        <button
                          onClick={() => { cozyAudio.playCutePop(); setModalPage(post); }}
                          className="px-3 py-1.5 rounded-xl border border-rose-200 hover:bg-rose-50 text-rose-700 text-xs font-bold"
                        >
                          📖 Ver Folha
                        </button>
                      </div>

                      {/* Content Preview */}
                      <div className="p-5 bg-rose-50/20">
                        <div className="bg-white p-5 rounded-2xl border border-rose-100 space-y-3">
                          <h3 className="font-playfair font-bold text-xl text-gray-800">{post.title}</h3>
                          <p className="font-caveat text-2xl text-gray-700 line-clamp-3 leading-relaxed">{post.content}</p>

                          {/* Stickers tags */}
                          {post.stickers?.length > 0 && (
                            <div className="flex flex-wrap gap-1.5 pt-2 border-t border-rose-100">
                              <span className="text-[10px] font-bold uppercase text-gray-400">Adesivos:</span>
                              {post.stickers.map((s, idx) => (
                                <span key={idx} className="text-lg p-1 bg-rose-50 rounded-lg border border-rose-100">{s.content}</span>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Likes & Comments */}
                      <div className="p-4 border-t border-rose-100 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <button
                            onClick={() => toggleLike(post.id)}
                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all ${
                              post.hasLiked ? 'bg-rose-100 text-rose-700' : 'bg-rose-50 text-gray-600 hover:bg-rose-100'
                            }`}
                          >
                            <span>{post.hasLiked ? '💖' : '🤍'}</span>
                            <span>{post.likesCount || 0} Corações</span>
                          </button>
                          <span className="text-xs text-gray-500 font-bold">💬 {post.comments?.length || 0} Comentários</span>
                        </div>

                        <button
                          onClick={() => { cozyAudio.playCutePop(); setCurrentPage(post); setActiveTab('editor'); }}
                          className="text-xs text-rose-600 hover:underline font-bold"
                        >
                          ✨ Copiar Estilo
                        </button>
                      </div>

                      {/* Comments stream */}
                      <div className="p-4 bg-rose-50/40 border-t border-rose-100 space-y-2">
                        {post.comments?.map(c => (
                          <div key={c.id} className="flex items-start gap-2 bg-white p-2 rounded-xl text-xs border border-rose-100">
                            <img src={c.avatar} alt={c.author} className="w-6 h-6 rounded-full object-cover" />
                            <div>
                              <span className="font-bold text-gray-800">{c.author}: </span>
                              <span className="text-gray-600">{c.text}</span>
                            </div>
                          </div>
                        ))}

                        <div className="flex items-center gap-2 pt-1">
                          <input
                            type="text"
                            placeholder="Deixe um carinho para a autora..."
                            onKeyDown={e => {
                              if (e.key === 'Enter' && e.target.value) {
                                addComment(post.id, e.target.value);
                                e.target.value = '';
                              }
                            }}
                            className="flex-1 px-3 py-1.5 rounded-xl border border-rose-200 text-xs bg-white focus:outline-none"
                          />
                          <span className="text-[10px] text-gray-400 font-bold">Pressione Enter</span>
                        </div>
                      </div>
                    </article>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Sticker & Washi Drawer Modal */}
          {isStickerDrawerOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-xs">
              <div className="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-rose-100 space-y-3">
                <div className="flex items-center justify-between pb-2 border-b border-rose-100">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🎀</span>
                    <h3 className="font-playfair font-bold text-gray-800 text-base">Estojo de Adesivos & Fitas</h3>
                  </div>
                  <button onClick={() => setIsStickerDrawerOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                </div>

                {/* Categories */}
                <div className="flex items-center gap-1 overflow-x-auto pb-2">
                  {STICKER_CATEGORIES.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => { cozyAudio.playCutePop(); setActiveStickerTab(cat.id); }}
                      className={`shrink-0 px-2.5 py-1 rounded-xl text-xs font-bold ${
                        activeStickerTab === cat.id ? 'bg-rose-500 text-white shadow-xs' : 'bg-rose-50 text-gray-600'
                      }`}
                    >
                      {cat.icon} {cat.name}
                    </button>
                  ))}
                  <button
                    onClick={() => { cozyAudio.playCutePop(); setActiveStickerTab('washi'); }}
                    className={`shrink-0 px-2.5 py-1 rounded-xl text-xs font-bold ${
                      activeStickerTab === 'washi' ? 'bg-rose-500 text-white shadow-xs' : 'bg-rose-50 text-gray-600'
                    }`}
                  >
                    🏷️ Washi Tape
                  </button>
                </div>

                {/* Grid */}
                <div className="max-h-64 overflow-y-auto p-1">
                  {activeStickerTab === 'washi' ? (
                    <div className="grid grid-cols-2 gap-2">
                      {WASHI_TAPES.map(w => (
                        <div
                          key={w.id}
                          onClick={() => addWashi(w)}
                          style={{ backgroundColor: w.color }}
                          className="p-2.5 rounded-xl border border-black/10 cursor-pointer text-xs font-bold text-black/60 shadow-xs hover:scale-102 transition-transform"
                        >
                          + {w.name}
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="grid grid-cols-4 gap-2">
                      {STICKER_CATEGORIES.find(c => c.id === activeStickerTab)?.stickers.map(stk => (
                        <button
                          key={stk.id}
                          onClick={() => addSticker(stk)}
                          className="flex flex-col items-center justify-center p-2 rounded-2xl bg-rose-50/50 hover:bg-rose-100/80 border border-rose-100 hover:scale-110 transition-all"
                        >
                          {stk.isTextBadge ? (
                            <span className="px-2 py-0.5 rounded-full text-[10px] bg-white text-rose-800 font-bold border border-rose-200">
                              {stk.content}
                            </span>
                          ) : (
                            <span className="text-3xl">{stk.content}</span>
                          )}
                          <span className="text-[10px] text-gray-500 mt-1 truncate">{stk.label}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Full Page View Modal */}
          {modalPage && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-rose-200 max-h-[90vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-rose-100">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📖</span>
                    <h3 className="font-playfair font-bold text-gray-800 text-lg">{modalPage.title}</h3>
                  </div>
                  <button onClick={() => setModalPage(null)} className="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                </div>

                <div className="p-6 rounded-2xl bg-rose-50/30 border border-rose-100 space-y-3">
                  <p className="text-xs text-gray-400">Por {modalPage.author?.name} • {modalPage.date}</p>
                  <p className="font-caveat text-2xl text-gray-700 leading-relaxed whitespace-pre-wrap">{modalPage.content}</p>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => {
                      cozyAudio.playCutePop();
                      setCurrentPage(modalPage);
                      setActiveTab('editor');
                      setModalPage(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xs"
                  >
                    ✨ Usar no Meu Diário
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white/70 border-t border-rose-100 py-4 text-center text-xs text-gray-400">
            <div className="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center gap-1 text-rose-700 font-bold">
                <span>🎀</span>
                <span>Diário Chérie</span>
                <span>•</span>
                <span className="text-gray-400 font-normal">Seu cantinho aconchegante de escrita & carinho</span>
              </div>
              <div>Fontes Manuscritas • Adesivos Interativos • Feed Privado</div>
            </div>
          </footer>
        </div>
      );
    }

    // Render React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
